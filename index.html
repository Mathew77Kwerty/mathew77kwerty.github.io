<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой первый сайт</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="nav"></div>

    <h1 class="center">Добро пожаловать на мой сайт!</h1>

    <p>Это мой первый тестовый сайт.</p>
    <p>Тут будет вся важная информация.</p>
    <p>Про мои проекты, сайты и тому подобное.</p>

    <img src="images/programmer.jpg" alt="Программист">

  <div id="footer"></div>

    <script>
        fetch('nav.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('nav').innerHTML = data;
            })
            .catch(error => console.error('Ошибка загрузки nav:', error));

        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer').innerHTML = data;
            })
            .catch(error => console.error('Ошибка загрузки footer:', error));
    </script>

</body>
</html>
