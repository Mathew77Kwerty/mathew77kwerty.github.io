<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Скоро...</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

   <div id="nav"></div>

    <h1 class="center">Скоро...</h1>

</body>

<div id="footer"></div>

    <script>
        fetch('nav.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('nav').innerHTML = data;
            })
            .catch(error => console.error('Ошибка загрузки nav:', error));

        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer').innerHTML = data;
            })
            .catch(error => console.error('Ошибка загрузки footer:', error));
    </script>
</body>
</html>
