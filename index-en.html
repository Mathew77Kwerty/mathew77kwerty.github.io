<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>My first website</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

   <div id="nav-en"></div>

    <h1 class="center">Welcome to my website!</h1>

   
    <p>This is my first test website.</p>
    <p>Here will be all the important information.</p>
    <p>About my projects, websites and so on.</p>


    <img src="images/programmer.jpg" alt="Programmer">

</body>

<div id="footer-en"></div>

    <script>
        fetch('nav-en.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('nav-en').innerHTML = data;
            })
            .catch(error => console.error('Error loading nav:', error));

        fetch('footer-en.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-en').innerHTML = data;
            })
            .catch(error => console.error('Error loading footer:', error));
    </script>

</body>
</html>
