<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Мои  проекты</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="nav"></div>


<h1>Мои проекты</h1>

<p>Пока тут пусто… но это ненадолго 😎</p>
<p>Скоро здесь появятся мои игры, сайты и другие штуки.</p>

</body>

<div id="footer"></div>

    <script>
        fetch('nav.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('nav').innerHTML = data;
            })
            .catch(error => console.error('Ошибка загрузки nav:', error));

        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer').innerHTML = data;
            })
            .catch(error => console.error('Ошибка загрузки footer:', error));
    </script>
</body>
</html>
