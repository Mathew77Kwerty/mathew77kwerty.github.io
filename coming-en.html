<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Soon...</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="nav-en"></div>

    <h1 class="center">Soon...</h1>

</body>

<div id="footer-en"></div>

    <script>
        fetch('nav-en.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('nav-en').innerHTML = data;
            })
            .catch(error => console.error('Error loading nav:', error));

        fetch('footer-en.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-en').innerHTML = data;
            })
            .catch(error => console.error('Error loading footer:', error));
    </script>

</body>
</html>
