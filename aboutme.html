<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Обо мне</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

   <div id="nav"></div>

    <h1 class="center">Обо мне!</h1>

    <p class="center">Меня зовут Матвей. Я учусь в украинской школе.</p>
    <p class="center">Мне 15 лет. Мне нравится программирование.</p>
    <p class="center">Я люблю создавать новые проекты. Создавать сайты я решил недавно.</p>

    <img src="images/Sites.jpg" alt="Сайты">

</body>

<div id="footer"></div>

    <script>
        fetch('nav.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('nav').innerHTML = data;
            })
            .catch(error => console.error('Ошибка загрузки nav:', error));

        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer').innerHTML = data;
            })
            .catch(error => console.error('Ошибка загрузки footer:', error));
    </script>
</body>
</html>
